<mat-card class="college-detail-card">
  <mat-card-header>
    <mat-card-title>{{ college.name }}</mat-card-title>
    <mat-card-subtitle>{{ college.location }} | Ranking: #{{ college.ranking }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="college.image" alt="{{ college.name }}" />
</mat-card>

<mat-tab-group>
  <mat-tab label="Courses">
    <ul>
      <li *ngFor="let course of college.courses">{{ course }}</li>
    </ul>
  </mat-tab>
  <mat-tab label="Reviews">
    <div *ngFor="let review of college.reviews" class="review">
      <mat-card>
        <mat-card-title>{{ review.user }}</mat-card-title>
        <mat-card-content>
          <span class="rating">⭐ {{ review.rating }}</span>
          <p>{{ review.comment }}</p>
        </mat-card-content>
      </mat-card>
    </div>
  </mat-tab>
</mat-tab-group>
