<div class="college-list">
  <mat-card *ngFor="let college of colleges" class="college-card">
    <mat-card-header>
      <mat-card-title>{{ college.name }}</mat-card-title>
      <mat-card-subtitle>{{ college.location }}</mat-card-subtitle>
    </mat-card-header>
    <img mat-card-image [src]="college.image" alt="{{ college.name }}" />
    <mat-card-content>
      <p>Ranking: #{{ college.ranking }}</p>
      <p>Courses: {{ college.courses.join(', ') }}</p>
      <p>Reviews: {{ college.reviews }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary">View Details</button>
    </mat-card-actions>
  </mat-card>
</div>
