<div class="admin-panel">
  <h2>Manage Colleges</h2>
  <table mat-table [dataSource]="colleges" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let college">{{ college.name }}</td>
    </ng-container>
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let college">{{ college.location }}</td>
    </ng-container>
    <ng-container matColumnDef="ranking">
      <th mat-header-cell *matHeaderCellDef>Ranking</th>
      <td mat-cell *matCellDef="let college">{{ college.ranking }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let college; let i = index">
        <button mat-button color="warn" (click)="deleteCollege(i)">Delete</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
