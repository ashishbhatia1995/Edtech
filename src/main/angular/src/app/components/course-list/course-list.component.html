<div class="course-list">
  <mat-card *ngFor="let course of courses" class="course-card">
    <mat-card-header>
      <mat-card-title>{{ course.title }}</mat-card-title>
      <mat-card-subtitle>{{ course.category }}</mat-card-subtitle>
    </mat-card-header>
    <div class="course-image-wrapper">
      <img mat-card-image [src]="course.image" alt="{{ course.title }}" (error)="course.image='https://via.placeholder.com/320x180?text=No+Image'" />
    </div>
    <mat-card-content>
      <p>{{ course.description }}</p>
      <span class="rating">⭐ {{ course.rating }}</span>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary">View Details</button>
    </mat-card-actions>
  </mat-card>
</div>
